<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111113" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <title>%SITE_TITLE%</title>
    <!-- Search and link previews (LinkedIn, messages). The SITE_ placeholders become siteUrl, searchTitle and searchDescription from src/content/site.json at build. -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_AUTHOR%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Livi Cracknell. Content operations. Digital platforms. Also DJ Livicee." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The identity glyphs and the headline both need these before first paint. -->
    <link rel="preload" href="./src/assets/fonts/fragment-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>
    <dialog id="filter-dialog" aria-labelledby="filter-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/workspace/main.ts"></script>
  </body>
</html>
